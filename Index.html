
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{--navy:#17365d;--blue:#2463a6;--bg:#f3f6fa;--ink:#1e293b;--muted:#64748b;--line:#dbe3ee;--green:#16834a;--red:#b42318}
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font:15px Arial,sans-serif;color:var(--ink)}
    header{background:linear-gradient(120deg,#102b4c,#245d91);color:white;padding:22px 18px}
    header .wrap,main{max-width:1100px;margin:auto}
    h1{font-size:22px;margin:0 0 6px}
    header p{margin:0;color:#dbeafe}
    main{padding:20px 14px 48px}
    .tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
    button,.btn{border:0;border-radius:9px;padding:11px 15px;background:var(--blue);color:white;font-weight:600;cursor:pointer}
    button.secondary{background:#e6edf5;color:#17365d}
    button.danger{background:#b42318}
    .panel,.card{background:white;border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;box-shadow:0 3px 12px #17365d0a}
    .hidden{display:none!important}
    .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
    label{display:block;font-size:13px;font-weight:700;margin:12px 0 6px;color:#334155}
    input,select,textarea{width:100%;padding:11px;border:1px solid #cbd5e1;border-radius:8px;font:inherit;background:white}
    textarea{min-height:85px;resize:vertical}
    .muted{color:var(--muted);font-size:13px}
    .notice{padding:12px;border-radius:9px;background:#eff6ff;color:#1e40af;margin:12px 0}
    .error{background:#fef2f2;color:var(--red)}
    .success{background:#ecfdf3;color:#067647}
    .stat{font-size:28px;font-weight:700;margin-top:5px}
    .table-wrap{overflow:auto}
    table{width:100%;border-collapse:collapse;min-width:650px}
    th,td{padding:10px;border-bottom:1px solid var(--line);text-align:left;font-size:13px;vertical-align:top}
    th{background:#f8fafc}
    .row-actions{display:flex;gap:7px;flex-wrap:wrap}
    .status{display:inline-block;border-radius:99px;padding:4px 9px;background:#fff7ed;color:#9a3412;font-size:12px}
    .status.ok{background:#ecfdf3;color:#067647}
    .field-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}

    .occupation-note{margin-top:9px;padding:12px;border:1px solid #bfdbfe;border-radius:9px;background:#f8fbff;color:#17365d;font-size:12px;line-height:1.5}
    .occupation-note h4{margin:0 0 7px;font-size:13px;color:#17365d}
    .occupation-note ol{margin:0;padding-left:22px;columns:2;column-gap:18px}
    .occupation-note li{padding:1px 0;break-inside:avoid}
    .occupation-note .note-warning{margin-top:8px;padding:8px;border-radius:7px;background:#fff3d6;color:#854d0e}

    .login-logo{display:flex;justify-content:center;align-items:center;margin:2px auto 14px}
    .login-logo img{display:block;width:125px;height:125px;object-fit:contain}
    .login-panel h2{text-align:center;margin-top:4px}

    @media(max-width:600px){
      .occupation-note ol{columns:1}
      header{padding:18px 14px}
      h1{font-size:19px}
      .panel{padding:14px}
      .login-logo img{width:110px;height:110px}
    }
  </style>
</head>

<body>
<header>
  <div class="wrap">
    <h1 id="schoolName">Verifikasi Biodata Siswa</h1>
    <p id="schoolYear">Tahun Pelajaran 2026/2027</p>
  </div>
</header>

<main>
  <div class="tabs">
    <button id="parentTab" onclick="showView('parent')">Orang Tua</button>
    <button class="secondary" id="adminTab" onclick="showView('admin')">Admin</button>
  </div>

  <section id="parentView">
    <div id="parentLogin" class="panel login-panel">
      <div class="login-logo">
        <img class="school-logo-image" alt="Logo SMP Bhakti Pertiwi">
      </div>

      <h2>Login Orang Tua</h2>
      <p class="muted">Masukkan nama siswa dan kelas sesuai database sekolah.</p>

      <label>Nama lengkap siswa</label>
      <input id="loginName" autocomplete="name" placeholder="Nama lengkap siswa">

      <label>Kelas</label>
      <input id="loginClass" placeholder="Contoh: 6A">

      <div class="field-actions">
        <button onclick="doParentLogin()">Masuk</button>
      </div>
      <div id="parentLoginMsg"></div>
    </div>

    <div id="parentForm" class="panel hidden">
      <div class="row-actions" style="justify-content:space-between;align-items:center">
        <h2>Periksa Biodata Siswa</h2>
        <button class="secondary" onclick="parentLogout()">Keluar</button>
      </div>

      <div id="parentStatus" class="notice"></div>
      <div class="grid" id="parentFields"></div>

      <div class="field-actions">
        <button onclick="saveParent()">Simpan dan Konfirmasi</button>
      </div>
      <div id="parentSaveMsg"></div>
    </div>
  </section>

  <section id="adminView" class="hidden">
    <div id="adminLogin" class="panel login-panel">
      <div class="login-logo">
        <img class="school-logo-image" alt="Logo SMP Bhakti Pertiwi">
      </div>

      <h2>Login Administrator</h2>

      <label>Username</label>
      <input id="adminUser" autocomplete="username">

      <label>Password</label>
      <input id="adminPass" type="password" autocomplete="current-password">

      <div class="field-actions">
        <button onclick="doAdminLogin()">Masuk Admin</button>
      </div>
      <div id="adminLoginMsg"></div>
    </div>

    <div id="adminPanel" class="hidden">
      <div class="tabs">
        <button onclick="loadDashboard()">Dashboard</button>
        <button class="secondary" onclick="loadStudents()">Data Siswa</button>
        <button class="secondary" onclick="loadCorrections()">Riwayat Koreksi</button>
        <button class="secondary" onclick="loadRefs()">Referensi</button>
        <button class="secondary" onclick="loadSettings()">Pengaturan</button>
        <button class="secondary" onclick="loadLogs()">Log Aktivitas</button>
        <button class="secondary" onclick="makeBackup()">Backup</button>
        <button class="danger" onclick="adminLogout()">Keluar</button>
      </div>

      <div id="adminContent" class="panel">
        <p class="muted">Pilih menu admin.</p>
      </div>
    </div>
  </section>
</main>

  img.src = SCHOOL_LOGO_DATA;

let parentToken='', adminToken='', parentRefs={}, currentStudent=null;

const parentFields=[
 ['NAMA_SISWA','Nama lengkap siswa','text'],
 ['AGAMA','Agama','select'],
 ['ASAL_SEKOLAH','Asal sekolah sebelumnya','text'],
 ['ANAK_KE','Anak ke-','number'],
 ['ALAMAT','Alamat lengkap','textarea'],
 ['STATUS_KELUARGA','Status dalam keluarga','select'],
 ['NAMA_AYAH','Nama ayah','text'],
 ['NAMA_IBU','Nama ibu','text'],
 ['PEKERJAAN_AYAH','Pekerjaan ayah','text'],
 ['PEKERJAAN_IBU','Pekerjaan ibu','text']
];

function call(fn,...args){
  return new Promise((resolve,reject)=>{
    google.script.run
      .withSuccessHandler(resolve)
      .withFailureHandler(e=>reject(new Error(e.message||e)))[fn](...args)
  });
}

function msg(id,text,type='notice'){
  const el=document.getElementById(id);
  el.className='notice '+(type==='error'?'error':type==='success'?'success':'');
  el.textContent=text;
}

function showView(v){
  document.getElementById('parentView').classList.toggle('hidden',v!=='parent');
  document.getElementById('adminView').classList.toggle('hidden',v!=='admin');
  document.getElementById('parentTab').className=v==='parent'?'':'secondary';
  document.getElementById('adminTab').className=v==='admin'?'':'secondary';
}

async function init(){
  try{
    const x=await call('getAppInfo');
    document.getElementById('schoolName').textContent=x.school;
    document.getElementById('schoolYear').textContent='Tahun Pelajaran '+x.year;
    if(x.status!=='AKTIF')msg('parentLoginMsg','Layanan sedang tidak aktif.');
  }catch(e){}
}

async function doParentLogin(){
  try{
    const r=await call(
      'parentLogin',
      document.getElementById('loginName').value,
      document.getElementById('loginClass').value
    );
    parentToken=r.token;
    parentRefs=r.refs||{};
    currentStudent=r.student;
    renderParentForm();
    document.getElementById('parentLogin').classList.add('hidden');
    document.getElementById('parentForm').classList.remove('hidden');
  }catch(e){
    msg('parentLoginMsg',e.message,'error');
  }
}

function renderParentForm(){
  const s=currentStudent;
  document.getElementById('parentStatus').innerHTML=
    'Status saat ini: <b>'+esc(s.STATUS_BIODATA||'BELUM_DIKONFIRMASI')+
    '</b>. Periksa semua informasi sebelum menyimpan.';

  const root=document.getElementById('parentFields');
  root.innerHTML='';

  parentFields.forEach(([key,label,type])=>{
    const wrap=document.createElement('div');
    const lab=document.createElement('label');
    lab.textContent=label;
    wrap.appendChild(lab);

    let el;
    if(type==='textarea'){
      el=document.createElement('textarea');
    }else if(type==='select'){
      el=document.createElement('select');
      el.appendChild(new Option('-- Pilih --',''));
      (parentRefs[key]||[]).forEach(v=>el.appendChild(new Option(v,v)));
    }else{
      el=document.createElement('input');
      el.type=type==='number'?'number':'text';
    }

    el.id='f_'+key;
    el.value=s[key]??'';
    if(key==='NAMA_SISWA')el.required=true;
    wrap.appendChild(el);

    if(key==='PEKERJAAN_AYAH'||key==='PEKERJAAN_IBU'){
      const note=document.createElement('div');
      note.className='occupation-note';
      note.innerHTML=`
        <h4>KETERANGAN PENGISIAN PEKERJAAN</h4>
        <ol>
          <li>WIRASWASTA</li>
          <li>NELAYAN</li>
          <li>PETANI</li>
          <li>PETERNAK</li>
          <li>PNS/TNI/POLRI</li>
          <li>KARYAWAN SWASTA</li>
          <li>PEDAGANG</li>
          <li>WIRAUSAHA</li>
          <li>BURUH</li>
          <li>PENSIUNAN</li>
          <li>TENAGA KERJA INDONESIA</li>
          <li>KARYAWAN BUMN</li>
          <li>LAINNYA</li>
          <li>SUDAH MENINGGAL</li>
        </ol>
        <div class="note-warning">
          <b>Catatan:</b> Jika Ayah atau Ibu sudah meninggal dunia,
          tuliskan <b>SUDAH MENINGGAL</b> pada kolom pekerjaan yang bersangkutan.
        </div>`;
      wrap.appendChild(note);
    }

    root.appendChild(wrap);
  });
}

async function saveParent(){
  const payload={};
  parentFields.forEach(([k])=>{
    payload[k]=document.getElementById('f_'+k).value;
  });

  if(!payload.NAMA_SISWA.trim()){
    msg('parentSaveMsg','Nama siswa wajib diisi.','error');
    return;
  }

  try{
    const r=await call('saveParentBiodata',parentToken,payload);
    currentStudent=r.student;
    renderParentForm();
    msg(
      'parentSaveMsg',
      `Berhasil. ${r.changed} data diperbarui. Status biodata: TERVERIFIKASI.`,
      'success'
    );
  }catch(e){
    msg('parentSaveMsg',e.message,'error');
  }
}

function parentLogout(){
  parentToken='';
  currentStudent=null;
  document.getElementById('parentForm').classList.add('hidden');
  document.getElementById('parentLogin').classList.remove('hidden');
  document.getElementById('loginName').value='';
  document.getElementById('loginClass').value='';
}

async function doAdminLogin(){
  try{
    const r=await call(
      'adminLogin',
      document.getElementById('adminUser').value,
      document.getElementById('adminPass').value
    );
    adminToken=r.token;
    document.getElementById('adminLogin').classList.add('hidden');
    document.getElementById('adminPanel').classList.remove('hidden');
    loadDashboard();
  }catch(e){
    msg('adminLoginMsg',e.message,'error');
  }
}

function adminLogout(){
  adminToken='';
  document.getElementById('adminPanel').classList.add('hidden');
  document.getElementById('adminLogin').classList.remove('hidden');
}

function esc(v){
  return String(v??'').replace(/[&<>"']/g,c=>({
    '&':'&amp;',
    '<':'&lt;',
    '>':'&gt;',
    '"':'&quot;',
    "'":'&#39;'
  }[c]));
}

async function loadDashboard(){
  const c=document.getElementById('adminContent');
  c.innerHTML='Memuat...';

  try{
    const d=await call('adminGetDashboard',adminToken);
    c.innerHTML=`
      <h2>Dashboard</h2>
      <div class="grid">
        <div class="card"><div class="muted">Total siswa</div><div class="stat">${d.total}</div></div>
        <div class="card"><div class="muted">Terverifikasi</div><div class="stat">${d.verified}</div></div>
        <div class="card"><div class="muted">Belum konfirmasi</div><div class="stat">${d.pending}</div></div>
        <div class="card"><div class="muted">Persentase</div><div class="stat">${d.percent}%</div></div>
      </div>
      <h3>Rekap per kelas</h3>
      <div class="table-wrap">
        <table>
          <tr><th>Kelas</th><th>Jumlah siswa</th></tr>
          ${d.byClass.map(x=>`<tr><td>${esc(x.kelas)}</td><td>${x.total}</td></tr>`).join('')}
        </table>
      </div>`;
  }catch(e){
    c.textContent=e.message;
  }
}

async function loadStudents(){
  const c=document.getElementById('adminContent');
  c.innerHTML=`
    <h2>Data Siswa</h2>
    <div class="grid">
      <div><label>Cari nama / ID</label><input id="qStudent"></div>
      <div><label>Kelas</label><input id="qClass" placeholder="Kosongkan untuk semua"></div>
      <div>
        <label>Status</label>
        <select id="qStatus">
          <option value="">Semua</option>
          <option>BELUM_DIKONFIRMASI</option>
          <option>TERVERIFIKASI</option>
        </select>
      </div>
    </div>
    <p>
      <button onclick="searchStudents()">Cari</button>
      <button class="secondary" onclick="studentEditor()">Tambah Siswa</button>
    </p>
    <div id="studentResults"></div>`;
  searchStudents();
}

async function searchStudents(){
  const c=document.getElementById('studentResults');
  c.textContent='Memuat...';

  try{
    const rows=await call(
      'adminListStudents',
      adminToken,
      document.getElementById('qStudent').value,
      document.getElementById('qClass').value,
      document.getElementById('qStatus').value
    );

    c.innerHTML=`
      <div class="table-wrap">
        <table>
          <tr><th>Nama</th><th>Kelas</th><th>Status</th><th>Aksi</th></tr>
          ${rows.map(s=>`
            <tr>
              <td>${esc(s.NAMA_SISWA)}</td>
              <td>${esc(s.KELAS)}</td>
              <td>${esc(s.STATUS_BIODATA)}</td>
              <td>
                <button class="secondary" onclick='studentEditor(${JSON.stringify(s).replace(/'/g,"&#39;")})'>Edit</button>
                <button class="danger" onclick="toggleStudent('${esc(s.ID_SISWA)}','NONAKTIF')">Nonaktifkan</button>
              </td>
            </tr>`).join('')}
        </table>
      </div>`;
  }catch(e){
    c.textContent=e.message;
  }
}

async function studentEditor(s={}){
  const c=document.getElementById('adminContent');
  let refs={};
  try{
    refs=await call('adminGetReferences',adminToken);
  }catch(e){}

  const fields=[
    ['NAMA_SISWA','Nama siswa'],
    ['KELAS','Kelas'],
    ['AGAMA','Agama'],
    ['ASAL_SEKOLAH','Asal sekolah'],
    ['ANAK_KE','Anak ke'],
    ['ALAMAT','Alamat'],
    ['STATUS_KELUARGA','Status keluarga'],
    ['NAMA_AYAH','Nama ayah'],
    ['NAMA_IBU','Nama ibu'],
    ['PEKERJAAN_AYAH','Pekerjaan ayah'],
    ['PEKERJAAN_IBU','Pekerjaan ibu']
  ];

  c.innerHTML=`
    <h2>${s.ID_SISWA?'Edit':'Tambah'} Siswa</h2>
    <input type="hidden" id="editId" value="${esc(s.ID_SISWA||'')}">
    <div class="grid">
      ${fields.map(([k,l])=>`
        <div>
          <label>${l}</label>
          ${['AGAMA','STATUS_KELUARGA'].includes(k)?
            `<select id="e_${k}">
              <option value="">-- Pilih --</option>
              ${refs.filter(r=>r[0]===k&&String(r[2]).toUpperCase()==='TRUE')
                .map(r=>`<option ${s[k]===r[1]?'selected':''}>${esc(r[1])}</option>`).join('')}
            </select>`:
            `<input id="e_${k}" value="${esc(s[k]||'')}">`}
        </div>`).join('')}
    </div>
    <p>
      <button onclick="saveStudent()">Simpan</button>
      <button class="secondary" onclick="loadStudents()">Kembali</button>
    </p>`;
}

async function saveStudent(){
  const keys=[
    'NAMA_SISWA','KELAS','AGAMA','ASAL_SEKOLAH','ANAK_KE',
    'ALAMAT','STATUS_KELUARGA','NAMA_AYAH','NAMA_IBU',
    'PEKERJAAN_AYAH','PEKERJAAN_IBU'
  ];

  const p={ID_SISWA:document.getElementById('editId').value};
  keys.forEach(k=>p[k]=document.getElementById('e_'+k).value);

  try{
    await call('adminSaveStudent',adminToken,p);
    loadStudents();
  }catch(e){
    alert(e.message);
  }
}

async function toggleStudent(id,status){
  if(!confirm('Nonaktifkan siswa ini? Data tidak dihapus permanen.'))return;

  try{
    await call('adminSetStudentStatus',adminToken,id,status);
    searchStudents();
  }catch(e){
    alert(e.message);
  }
}

async function loadCorrections(){
  const c=document.getElementById('adminContent');
  c.innerHTML='Memuat...';

  try{
    const rows=await call('adminGetCorrections',adminToken,200);
    c.innerHTML=`
      <h2>Riwayat Koreksi</h2>
      <div class="table-wrap">
        <table>
          <tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Field</th><th>Data lama</th><th>Data baru</th><th>Sumber</th></tr>
          ${rows.map(r=>`
            <tr>
              <td>${esc(r.time)}</td>
              <td>${esc(r.name)}</td>
              <td>${esc(r.klass)}</td>
              <td>${esc(r.field)}</td>
              <td>${esc(r.oldValue)}</td>
              <td>${esc(r.newValue)}</td>
              <td>${esc(r.source)}</td>
            </tr>`).join('')}
        </table>
      </div>`;
  }catch(e){
    c.textContent=e.message;
  }
}

async function loadRefs(){
  const c=document.getElementById('adminContent');

  try{
    const rows=await call('adminGetReferences',adminToken);
    c.innerHTML=`
      <h2>Referensi Formulir</h2>
      <div class="grid">
        <div>
          <label>Kategori</label>
          <select id="refCat">
            ${['AGAMA','STATUS_KELUARGA','PEKERJAAN_AYAH','PEKERJAAN_IBU'].map(x=>`<option>${x}</option>`).join('')}
          </select>
        </div>
        <div><label>Pilihan</label><input id="refChoice"></div>
        <div><label>Urutan</label><input id="refOrder" type="number" value="99"></div>
      </div>
      <p><button onclick="saveRef()">Tambah / Perbarui</button></p>
      <div class="table-wrap">
        <table>
          <tr><th>Kategori</th><th>Pilihan</th><th>Aktif</th><th>Urutan</th></tr>
          ${rows.map(r=>`
            <tr><td>${esc(r[0])}</td><td>${esc(r[1])}</td><td>${esc(r[2])}</td><td>${esc(r[3])}</td></tr>`).join('')}
        </table>
      </div>`;
  }catch(e){
    c.textContent=e.message;
  }
}

async function saveRef(){
  try{
    await call(
      'adminSaveReference',
      adminToken,
      document.getElementById('refCat').value,
      document.getElementById('refChoice').value,
      true,
      document.getElementById('refOrder').value
    );
    loadRefs();
  }catch(e){
    alert(e.message);
  }
}

async function loadSettings(){
  const c=document.getElementById('adminContent');

  try{
    const rows=await call('adminGetSettings',adminToken);
    c.innerHTML=`
      <h2>Pengaturan</h2>
      ${rows.map(r=>`
        <div>
          <label>${esc(r[0])}</label>
          <input id="set_${esc(r[0])}" value="${esc(r[1])}">
          <button class="secondary" onclick="saveSetting('${esc(r[0])}')">Simpan</button>
        </div>`).join('')}`;
  }catch(e){
    c.textContent=e.message;
  }
}

async function saveSetting(k){
  try{
    await call('adminSaveSetting',adminToken,k,document.getElementById('set_'+k).value);
    alert('Pengaturan disimpan.');
  }catch(e){
    alert(e.message);
  }
}

async function loadLogs(){
  const c=document.getElementById('adminContent');

  try{
    const rows=await call('adminGetLogs',adminToken,200);
    c.innerHTML=`
      <h2>Log Aktivitas</h2>
      <div class="table-wrap">
        <table>
          <tr><th>Waktu</th><th>Nama</th><th>Kelas</th><th>Aktivitas</th><th>Keterangan</th><th>Sumber</th></tr>
          ${rows.map(r=>`
            <tr>
              <td>${esc(r[5])}</td>
              <td>${esc(r[2])}</td>
              <td>${esc(r[3])}</td>
              <td>${esc(r[4])}</td>
              <td>${esc(r[6])}</td>
              <td>${esc(r[7])}</td>
            </tr>`).join('')}
        </table>
      </div>`;
  }catch(e){
    c.textContent=e.message;
  }
}

async function makeBackup(){
  try{
    const r=await call('adminCreateBackup',adminToken);
    document.getElementById('adminContent').innerHTML=`
      <div class="notice success">
        Backup berhasil dibuat:
        <a href="${esc(r.url)}" target="_blank">Buka file backup</a>
      </div>`;
  }catch(e){
    alert(e.message);
  }
}

init();
</script>
</body>
</html>
